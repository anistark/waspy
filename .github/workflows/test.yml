name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

      # Explicit required gate for the example/feature harness: every
      # examples/*.py must compile, instantiate, and pass its asserted-result
      # tests (tests/integration/, tests/unit/). Also covered by the full run
      # above; kept as its own step so a harness failure is visible by name.
      - name: Integration and unit harness (required gate)
        run: >-
          cargo test --all-features
          --test integration_examples
          --test integration_coverage
          --test unit_basics
          --test unit_errors
          --test unit_memory_safety
          --test unit_miscompiles
          --test integration_wasmrun_plugin

  runtime:
    name: End-to-end programs under real runtimes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: extractions/setup-just@v2

      # Pinned to a released asset with a checksum rather than piping
      # wasmtime.dev/install.sh to bash: that script is fetched fresh on every
      # run, so what the gate executes is whatever the URL served that minute,
      # and the version it installs moves under us. Bump both lines together,
      # deliberately, after running `just verify-runtime` against the new one.
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v46.0.1
          WASMTIME_SHA256: 9ae0b17ea298bcc52277a8208d6ab7fae8e1a89579672f9d82f9d86c116edb62
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          dir="wasmtime-${WASMTIME_VERSION}-x86_64-linux"
          curl -fsSL --proto '=https' --tlsv1.2 -o "${dir}.tar.xz" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/${dir}.tar.xz"
          echo "${WASMTIME_SHA256}  ${dir}.tar.xz" | sha256sum --check --strict
          tar -xJf "${dir}.tar.xz"
          mkdir -p "$HOME/.wasmtime/bin"
          mv "${dir}/wasmtime" "$HOME/.wasmtime/bin/"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      # The whole-program gate. The harness above asserts these same results
      # with wasmi inside the test process; this asserts them under the engines
      # a user actually ships against, for both the unoptimized and the
      # Binaryen-optimized binary, and then compiles every bundled example.
      # A release does not go out on a red run here.
      - name: Whole programs under Node and wasmtime (required gate)
        run: just verify-examples
