# `pip install waspy` installs the `waspy` command-line compiler, built from
# this crate by maturin (the binary, not a Python extension).
[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "waspy"
description = "A Python to WebAssembly compiler: compile a typed subset of Python ahead of time into a standalone WebAssembly module."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Kumar Anirudha" }]
keywords = ["python", "compiler", "webassembly", "wasm", "wasi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Compilers",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://anistark.github.io/waspy/"
Repository = "https://github.com/anistark/waspy"
Documentation = "https://anistark.github.io/waspy/docs/cli/"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
