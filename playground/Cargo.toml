[package]
name = "waspy-playground"
version = "0.0.0"
edition = "2021"
publish = false
description = "Waspy built to WebAssembly for the docs-site playground."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
waspy = { path = "..", default-features = false }
# Pinned: the generated JS glue must match the wasm-bindgen CLI exactly
# (`just playground` locally, the docs workflow in CI). Bump all three together.
wasm-bindgen = "=0.2.127"
serde_json = "1.0"
anyhow = "1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Standalone: built only for wasm32 and kept out of the library's own build.
[workspace]
